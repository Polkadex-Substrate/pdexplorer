# Continuous integration.  (Audit F-028)
#
# The finding was "there are no automated tests; probes are not tests". A suite
# now exists — 1,128 assertions plus six mutation harnesses — but round 3's
# residual is sharper and still true: *a green deploy can skip the suite*.
# `deploy.sh` builds and restarts; nothing forces `npm test` to have passed
# first. A suite nobody is obliged to run is documentation, not a gate.
#
# This is that gate. Tests use node:test and node:sqlite; responsive DOM/CSS
# checks use Happy DOM. All dependencies are installed from the lockfile.
name: CI

on:
  # main only. A branch with an open PR is already covered by the pull_request
  # trigger; `push: ['**']` ran every job twice for every PR commit.
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Lets an operator confirm a red main before deploying, without a push. Also
  # the way to run the FULL mutation set on demand.
  workflow_dispatch:
  # Full mutation run every night, so PRs never have to carry it alone.
  schedule:
    - cron: '17 3 * * *'

# A newer push to the same PR/branch makes the older run pointless; do not pay
# for it. (The nightly run has its own ref and is never cancelled by a push.)
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Must match the Dockerfiles (22.11).
      #
      # This comment used to say "node:sqlite is behind a flag before 22.5",
      # which has the direction backwards and cost a red CI for ten days.
      # node:sqlite ARRIVED in 22.5.0 behind --experimental-sqlite and was
      # unflagged in 22.13.0. So on 22.11 — the version pinned here and in both
      # Dockerfiles — the flag is REQUIRED.
      #
      # `npm test` did not pass it. It passed locally anyway because a developer
      # machine on >=22.13 needs no flag, so the suite was green everywhere
      # except the one environment that matches production. That is precisely
      # the mismatch this step exists to prevent, and the wrong comment is what
      # let it through. The flag now lives in the npm script (harmless on newer
      # Node, required on this one) rather than here, so `npm test` behaves the
      # same for a developer, for CI, and inside the image.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.11'
          cache: npm

      # `ci`, not `install`: it installs exactly the lockfile (F-102) and fails
      # if package.json and package-lock.json have drifted apart.
      - run: npm ci

      - name: Unit and contract tests
        run: npm test

      # The build catches what the suite cannot: a syntax error or bad import in
      # script.js only surfaces when Vite bundles it.
      - name: Frontend build
        run: npm run build

      # Shell entrypoints are part of the deploy path and are not covered by
      # node --test. A parse error here is a failed production deploy.
      - name: Shell syntax
        run: |
          for f in deploy.sh provision-ubuntu.sh init-letsencrypt.sh tools/*.sh; do
            [ -f "$f" ] || continue
            bash -n "$f" || { echo "::error file=$f::bash -n failed"; exit 1; }
          done

  # Mutation harnesses rewrite files in place and each mutant needs a test run.
  # They used to run one after another in a single job (about 90 mutants, each
  # followed by the whole suite). Now:
  #   plan            decides whether to run and lists the harnesses
  #   mutation-shard  one job per harness, in parallel (a harness only mutates
  #                   its own checkout, so shards cannot interfere)
  #   mutation        the single gate; keeps the old required-check name
  # Inside a shard tools/lib/suite-runner.mjs runs only the tests that mention
  # the mutated file, in parallel, stopping at the first red one; a survivor is
  # still confirmed against the whole suite before it is reported.
  plan:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.p.outputs.run }}
      harnesses: ${{ steps.p.outputs.harnesses }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: p
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          echo "harnesses=$(ls tools/mutation-*.mjs | jq -R -s -c 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"
          run=true
          if [ "$EVENT" = pull_request ]; then
            if [ "$DRAFT" = true ]; then
              echo "Draft PR: mutation waits for ready-for-review."
              run=false
            else
              # Docs-only change cannot move a mutant verdict.
              code=$(git diff --name-only "$BASE" HEAD | grep -Ev '^(docs/|.*\.md$)' || true)
              if [ -z "$code" ]; then echo "Docs-only PR: nothing to mutate."; run=false; fi
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  mutation-shard:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        harness: ${{ fromJSON(needs.plan.outputs.harnesses) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.11'
          cache: npm
      - run: npm ci
      - name: Mutation harness
        run: |
          echo "=== ${{ matrix.harness }} ==="
          fail=0
          node "${{ matrix.harness }}" || fail=1
          # Every harness restores the file it mutated; if one crashed midway,
          # say so loudly rather than leaving a rewritten tree behind.
          if ! git diff --quiet; then
            echo "::error::a mutation harness left the tree modified"
            git diff --stat
            exit 1
          fi
          exit $fail

  mutation:
    needs: [plan, mutation-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        env:
          PLAN: ${{ needs.plan.result }}
          RUN: ${{ needs.plan.outputs.run }}
          SHARDS: ${{ needs.mutation-shard.result }}
        run: |
          [ "$PLAN" = success ] || { echo "::error::plan job: $PLAN"; exit 1; }
          if [ "$RUN" != true ]; then echo "mutation skipped by plan"; exit 0; fi
          [ "$SHARDS" = success ] || { echo "::error::mutation shards: $SHARDS"; exit 1; }
