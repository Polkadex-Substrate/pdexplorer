# Compress text-ish assets. gzip_static would serve pre-compressed files if
# Vite ever emits .gz alongside originals; for now on-the-fly gzip is enough.
gzip on;
gzip_vary on;
gzip_min_length 256;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    application/atom+xml
    application/javascript
    application/json
    application/ld+json
    application/manifest+json
    application/rss+xml
    application/vnd.geo+json
    application/vnd.ms-fontobject
    application/wasm
    application/x-font-ttf
    application/xhtml+xml
    application/xml
    font/opentype
    image/bmp
    image/svg+xml
    image/x-icon
    text/cache-manifest
    text/css
    text/plain
    text/vcard
    text/vnd.rim.location.xloc
    text/vtt
    text/x-component
    text/x-cross-domain-policy;

# --- Access logging: never record query strings ------------------------------
# Audit F-091. The default `combined` format logs $request, which is the whole
# request line INCLUDING the query string. Several of our URLs carry a bearer
# secret there:
#
#   /api/email/preferences?token=<unsubscribeToken>   (read + write prefs)
#   /email/preferences?token=<unsubscribeToken>       (the SPA page itself)
#   /api/email/unsubscribe?token=...                  (legacy links already sent)
#
# Those tokens do not expire and are not rotated on read, so anyone who can see
# the access log — an operator, a log shipper, a backup, or an attacker who got
# read-only access to /var/log — can unsubscribe or re-target any subscriber's
# alerts. Logs are also the one place secrets get copied around casually.
#
# `$uri` is the decoded path with the query string dropped, so this keeps the
# log useful for traffic analysis (path, status, bytes, latency, real client IP)
# while structurally preventing a token from ever landing in it. The cost is
# real and worth stating: you can no longer debug "which ?page= did they ask
# for" from the log. That is the trade we want — pagination is reproducible,
# a leaked token is not.
#
# NOTE: every `server` block must install this, and no `location` may override
# it with a format that logs $request / $request_uri / $query_string — either
# omission silently re-opens the finding for that path.
log_format noquery '$remote_addr - $remote_user [$time_local] '
                   '"$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" rt=$request_time';

# Declared here, INSTALLED PER SERVER BLOCK below — and that distinction is the
# whole fix, so it is worth spelling out.
#
# This file is copied to /etc/nginx/conf.d/default.conf, which the base image's
# /etc/nginx/nginx.conf includes from INSIDE its `http { }` block — after that
# file has already written:
#
#     log_format  main  '... "$request" ...';
#     access_log  /var/log/nginx/access.log  main;
#
# nginx allows several access_log directives at the same level and writes to
# ALL of them. Inheritance is only suppressed when a directive exists at the
# CURRENT level. So putting `access_log ... noquery;` here, at http level
# alongside the base image's, would not replace it — it would ADD a second log
# line per request while the `main` line kept the token. The finding would read
# as closed while being untouched, and log volume would double.
#
# Declaring it in each `server { }` block instead defines it at server level,
# which DOES suppress the inherited http-level directive.
#
# `access_log off;` is not an alternative: it cancels the level, taking noquery
# with it.

# --- Cloudflare real-IP trust -----------------------------------------------
# When the site is fronted by Cloudflare's proxy, every connection nginx sees
# is from a Cloudflare edge node. Without these directives, $remote_addr and
# the access log would only ever show Cloudflare IPs — bad for rate limiting,
# fail2ban, and debugging. set_real_ip_from + real_ip_header tell nginx to
# trust the CF-Connecting-IP header from connections originating in
# Cloudflare's published ranges, and use it as $remote_addr.
#
# Source of truth: https://www.cloudflare.com/ips-v4 and /ips-v6
#
# Audit F-109: this list used to be the ONLY one, hand-maintained and baked
# into the image, while `provision-ubuntu.sh cloudflare` fetched a live list
# for UFW. The two drifted silently, and the drift was not cosmetic — a range
# UFW allows but nginx does not trust yields $remote_addr = the Cloudflare edge
# IP, which collapses every per-IP rate limit (auth included) into one bucket.
#
# The provisioning script now writes the same list to
# /etc/cloudflare/nginx-real-ip.conf, mounted read-only at
# /etc/nginx/cloudflare/. The wildcard include below picks it up when present.
#
# The literal list is KEPT as a floor, deliberately:
#   * a wildcard include that matches nothing is not an error in nginx, so a
#     host that has never run the cloudflare phase still gets working real-IP
#     handling rather than silently trusting nothing;
#   * duplicate set_real_ip_from directives are harmless — nginx unions them;
#   * so the mounted file can only ever ADD ranges, never remove protection.
#
# The consequence to be aware of: a range REMOVED from Cloudflare's list stays
# trusted until the image is rebuilt. That is the safe direction (over-trusting
# a range Cloudflare used to own, versus under-trusting one it now owns), but
# it means the literal list below should still be refreshed at image-build time
# rather than left indefinitely.
include /etc/nginx/cloudflare/*.conf;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
# `recursive on` lets nginx walk back through trusted proxies if there's ever
# a chain (e.g. Cloudflare → another proxy → us). Harmless when Cloudflare is
# the only proxy.
real_ip_recursive on;

# Common headers we want on every response. `map` lets us reuse them
# from both server blocks without duplicating.
map $sent_http_content_type $cache_control_for_type {
    default                          "public, max-age=300";
    ~^text/html                      "no-cache, no-store, must-revalidate";
    ~^application/javascript         "public, max-age=31536000, immutable";
    ~^text/css                       "public, max-age=31536000, immutable";
    ~^image/                         "public, max-age=2592000";
    ~^font/                          "public, max-age=31536000, immutable";
    ~^application/font               "public, max-age=31536000, immutable";
    ~^application/manifest\+json     "public, max-age=86400";
    ~^application/xml                "public, max-age=300";
    ~^text/plain                     "public, max-age=300";
    # JSON responses come from the /api/* backend, which sets its own tiered
    # Cache-Control via cacheShort/cacheMedium/cacheLong in server.js. Empty
    # string here tells nginx's add_header to skip the directive entirely
    # (per its docs), so the backend's value passes through cleanly without
    # being duplicated. Removing this entry would re-introduce the "two
    # Cache-Control headers" bug.
    ~^application/json               "";
}

server {
    # 8080, not 80: nginx runs unprivileged (uid 101, audit F-040) and can't
    # bind <1024. docker-compose maps host 80 → container 8080.
    listen 8080;
    server_name explorer.polkadex.ee;

    # F-091: server-level, so the base image's http-level `main` format (which
    # logs $request, query string and all) is NOT inherited.
    access_log /var/log/nginx/access.log noquery;

    # Audit F-041: the security headers used to exist ONLY on the :8443 block,
    # but THIS block serves real content whenever Cloudflare fronts us in
    # Flexible-SSL mode (the non-redirect branch of `location /` below) — so
    # that entire path shipped without nosniff, frame protection, or the CSP.
    # The set must match :8443's; a drift between them is this finding again.
    # HSTS included deliberately: on the Flexible path the BROWSER's connection
    # is HTTPS (to Cloudflare), so the header is honored; on a genuine
    # plain-HTTP hit browsers ignore HSTS by spec, making it harmless.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' wss://rpc.polkadex.ee; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Build stamp — never cache. Mirrors the :443 block; this server block also
    # serves content when Cloudflare fronts us with Flexible SSL.
    location = /version.json {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Robots-Tag "noindex" always;
    }

    # Same vendored-script rule as the :8443 block. This server block really
    # does serve content (the Cloudflare Flexible-SSL path below), so without
    # it a missing /vendor/*.js would fall through to index.html here too.
    location ~* ^/vendor/ {
        root /usr/share/nginx/html;
        access_log off;
        expires 1d;
        # add_header inside a location RESETS inheritance, so the server-level
        # security headers have to be repeated here or these responses ship
        # without them.
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location / {
        # Check if traffic is coming from a proxy (like Cloudflare) that already did HTTPS
        set $do_redirect 0;
        if ($http_x_forwarded_proto != "https") {
            set $do_redirect 1;
        }
        # If it's a direct HTTP hit (no proxy), redirect to HTTPS
        if ($do_redirect = 1) {
            return 301 https://$host$request_uri;
        }

        # Otherwise serve the content directly (Cloudflare Flexible SSL)
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # SEO surfaces — served by the backend so the sitemap can be generated
    # dynamically from the SQLite index.
    location = /robots.txt {
        proxy_pass http://backend:3001/robots.txt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /sitemap.xml {
        proxy_pass http://backend:3001/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # /developers is server-rendered by the backend (crawler / AI / curl
    # readable with no JS). In-app SPA navigation to /developers is handled
    # client-side and never hits this exact-match location.
    location = /developers {
        proxy_pass http://backend:3001/developers;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Audit F-112: the SPA fallback correctly ignores `/api/`, but a bare
    # `GET /api` (no trailing slash) matched `location /` and was answered with
    # index.html — an HTML body under an API-looking URL, which reads to a
    # client as "the API returned garbage". Redirect it to the real prefix.
    location = /api { return 301 /api/; }

    # Developer API — see the matching block on :8443 for the full rationale
    # (audit F-143). ^~ so these win over the generic /api/ prefix below.
    location ^~ /api/state/ {
        gzip off;
        # F-143 set this to 20s to match DEV_API_TIMEOUT_MS. A review pointed
        # out that EQUAL is a race, not a match: withTimeout bounds only the RPC
        # call, and JSON-serialising a megabyte /api/decode payload happens
        # after it. A request whose RPC lands at 19.9s would get nginx's 504
        # instead of the backend's own JSON error, which is strictly less
        # useful. The proxy timeout must be the OUTER bound.
        proxy_read_timeout 30s;
        proxy_pass http://backend:3001/api/state/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /api/decode/ {
        gzip off;
        # F-143 set this to 20s to match DEV_API_TIMEOUT_MS. A review pointed
        # out that EQUAL is a race, not a match: withTimeout bounds only the RPC
        # call, and JSON-serialising a megabyte /api/decode payload happens
        # after it. A request whose RPC lands at 19.9s would get nginx's 504
        # instead of the backend's own JSON error, which is strictly less
        # useful. The proxy timeout must be the OUTER bound.
        proxy_read_timeout 30s;
        proxy_pass http://backend:3001/api/decode/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    # 8443, not 443: unprivileged nginx (audit F-040). Host 443 → container 8443.
    listen 8443 ssl;
    http2 on;
    server_name explorer.polkadex.ee;

    # F-091 — see the :8080 block. Both server blocks must carry this; a block
    # without it silently inherits the token-logging format.
    access_log /var/log/nginx/access.log noquery;

    ssl_certificate /etc/letsencrypt/live/explorer.polkadex.ee/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/explorer.polkadex.ee/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers that crawlers and SEO scorers grade favorably.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Cache-Control $cache_control_for_type always;

    # Content-Security-Policy — audit F-039, the last piece of the wallet's
    # supply-chain story. Shippable only because everything is now
    # same-origin: F-029 vendored the CDN scripts, F-039's prep vendored the
    # Boxicons stylesheet (unpkg) and Inter (Google Fonts), and the last nine
    # inline on*= handlers were replaced with addEventListener (F-165) —
    # script-src 'self' blocks inline handlers, which is most of its value.
    #
    # Per-directive rationale; every allowance is a census result, not a guess:
    #   script-src 'self' 'wasm-unsafe-eval'
    #                          — no inline scripts (the JSON-LD blocks are
    #                            type=application/ld+json, inert data), no
    #                            eval, no third-party script origin anywhere.
    #                            This is the directive that turns a future XSS
    #                            escape miss from "wallet compromise" into
    #                            "broken markup". 'wasm-unsafe-eval' is NOT
    #                            'unsafe-eval': it permits WebAssembly
    #                            compilation only, no JS eval — and it is
    #                            required because @polkadot/wasm-crypto (the
    #                            sr25519 signing/verification core in the
    #                            bundle) calls WebAssembly.instantiate. The
    #                            policy census caught this: without it the CSP
    #                            would have shipped green and broken wallet
    #                            signing — the audit's exact
    #                            "CSP-can-blank-the-SPA" failure mode.
    #   connect-src            — /api/* is 'self'; the SPA dials the chain
    #                            DIRECTLY at wss://rpc.polkadex.ee (WsProvider
    #                            in script.js) for live heads and signing.
    #                            Omitting it blanks the wallet. If the RPC
    #                            endpoint ever moves, THIS LINE moves with it.
    #   style-src 'unsafe-inline' — the SPA sets style="" attributes
    #                            throughout its rendered markup. Inline STYLE
    #                            is not the injection surface scripts are, and
    #                            removing it means touching thousands of lines
    #                            for cosmetic gain.
    #   img-src data:          — qrcodejs renders the donate-page QR into an
    #                            <img src="data:...">.
    #   object-src 'none', base-uri 'self', form-action 'self' — nothing uses
    #                            plugins, <base>, or cross-origin forms; deny
    #                            so an injected element can't introduce them.
    #   frame-ancestors 'self' — the CSP-native form of X-Frame-Options above.
    #
    # Blob downloads (CSV/JSON exports via <a download>) are downloads, not
    # document loads — no allowance needed. Wallet browser extensions inject
    # content scripts, which CSP does not govern — connect/sign flows are
    # unaffected.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' wss://rpc.polkadex.ee; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # Hashed JS/CSS bundles emitted by Vite — long-lived, immutable cache.
    location ~* ^/assets/.*\.(?:js|css|woff2?|ttf|eot|otf|svg|png|jpg|jpeg|gif|webp|avif|ico)$ {
        root /usr/share/nginx/html;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Vendored third-party scripts (audit F-029): chart.umd.js, qrcode.min.js,
    # copied out of node_modules at build time by tools/vendor-assets.mjs.
    #
    # `try_files $uri =404` is the important line. Without its own location
    # these would hit the SPA fallback, so a build that failed to populate
    # public/vendor would serve index.html with a JS content-type — the browser
    # would report a syntax error and every chart would silently vanish. A 404
    # is diagnosable; a 200 of the wrong thing is not.
    #
    # Cache is 1 day, NOT 1 year immutable: unlike /assets/ these filenames
    # carry no content hash, so a version bump reuses the same URL.
    location ~* ^/vendor/ {
        root /usr/share/nginx/html;
        access_log off;
        expires 1d;
        # add_header inside a location RESETS inheritance, so the server-level
        # security headers have to be repeated here or these responses ship
        # without them.
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # SEO surfaces (dynamic) — proxied to backend.
    location = /robots.txt {
        proxy_pass http://backend:3001/robots.txt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /sitemap.xml {
        proxy_pass http://backend:3001/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # /developers is server-rendered by the backend (crawler / AI / curl
    # readable with no JS). In-app SPA navigation to /developers is handled
    # client-side and never hits this exact-match location.
    location = /developers {
        proxy_pass http://backend:3001/developers;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Build stamp — must NEVER be cached. This file answers "which build is
    # live?", and a cached answer is worse than no answer because it is
    # confidently wrong: the edge served the previous SHA while the origin was
    # already on the new one, which is precisely the confusion this file exists
    # to remove. The application/json entry in the cache_control map above
    # deliberately emits nothing (so backend headers pass through), but this is
    # a static file with no backend to set them — hence an explicit directive.
    location = /version.json {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Robots-Tag "noindex" always;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # SPA fallback — every clean-URL route (/blocks, /validator/<addr>, …)
        # resolves to index.html so the client router can take it from there.
        try_files $uri $uri/ /index.html;
    }

    # Audit F-112: the SPA fallback correctly ignores `/api/`, but a bare
    # `GET /api` (no trailing slash) matched `location /` and was answered with
    # index.html — an HTML body under an API-looking URL, which reads to a
    # client as "the API returned garbage". Redirect it to the real prefix.
    location = /api { return 301 /api/; }

    # --- Developer API: no gzip, and a timeout that agrees with the backend ---
    # Audit F-143. The global `gzip on` above lists application/json, so every
    # proxied API response is compressed at level 6 by the nginx worker. For the
    # small, cacheable JSON the SPA lives on that is a good trade. For these two
    # endpoints it is not:
    #
    #   /api/state/<pallet>/<item>?entries=1  — up to DEV_API_MAX_ENTRIES decoded
    #                                           storage entries, each with a hex
    #                                           key and a fully expanded value
    #   /api/decode/<block>                   — every extrinsic in a block with
    #                                           its arguments rendered out
    #
    # These are megabyte-scale, uncacheable, and served to a handful of
    # developers and crawlers rather than to page traffic. Compressing them
    # burns a whole nginx worker on CPU for the duration — and nginx workers are
    # what serve everyone ELSE's requests, so the cost lands on the SPA, not on
    # the caller who asked for the big response. Cloudflare compresses on the
    # edge→browser hop regardless, so the bytes on the wire that matter are
    # unaffected for proxied traffic.
    #
    # proxy_read_timeout 20s is DEV_API_TIMEOUT_MS (server.js: `const
    # DEV_API_TIMEOUT_MS = readPositiveInteger(process.env.DEV_API_TIMEOUT_MS,
    # 20000)`). The default 60s meant nginx held a worker connection open for
    # three times as long as the backend was ever going to keep working on the
    # request. They are two halves of one deadline and must be changed together:
    # if you raise DEV_API_TIMEOUT_MS in .env and leave this at 20s, nginx cuts
    # the request off before the backend's own timeout can produce its useful
    # JSON error, and callers get an opaque 504 instead.
    # test/infra-config.test.js asserts the two stay equal.
    #
    # `^~` is deliberate. Longest-prefix already beats `location /api/`, but a
    # regex location added later (nginx checks regexes BEFORE settling on a
    # plain prefix match) would silently steal these requests and take the
    # gzip/timeout settings with it. `^~` stops the regex phase outright.
    location ^~ /api/state/ {
        gzip off;
        # F-143 set this to 20s to match DEV_API_TIMEOUT_MS. A review pointed
        # out that EQUAL is a race, not a match: withTimeout bounds only the RPC
        # call, and JSON-serialising a megabyte /api/decode payload happens
        # after it. A request whose RPC lands at 19.9s would get nginx's 504
        # instead of the backend's own JSON error, which is strictly less
        # useful. The proxy timeout must be the OUTER bound.
        proxy_read_timeout 30s;
        proxy_pass http://backend:3001/api/state/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /api/decode/ {
        gzip off;
        # F-143 set this to 20s to match DEV_API_TIMEOUT_MS. A review pointed
        # out that EQUAL is a race, not a match: withTimeout bounds only the RPC
        # call, and JSON-serialising a megabyte /api/decode payload happens
        # after it. A request whose RPC lands at 19.9s would get nginx's 504
        # instead of the backend's own JSON error, which is strictly less
        # useful. The proxy timeout must be the OUTER bound.
        proxy_read_timeout 30s;
        proxy_pass http://backend:3001/api/decode/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
