# Audit F-108 — container hardening. What is applied, and what deliberately is
# NOT, because a wrong guess here fails at 03:00 on a renewal night:
#
#   security_opt: no-new-privileges  — all three services. Blocks setuid/setgid
#     escalation inside the container. The Docker DAEMON default is also set to
#     no-new-privileges by provision-ubuntu.sh (`install_docker`); repeating it
#     per service means the guarantee survives a hand-run `docker compose up`
#     on a box that was never provisioned by that script.
#
#   pids_limit — all three. A fork bomb in any container can otherwise exhaust
#     the HOST pid table and take the other containers (and sshd) with it.
#     Values are generous: the backend forks WORKERS (≤16) node processes, each
#     with its own libuv threadpool.
#
#   cap_drop: [ALL] — backend and frontend only. Both already run as non-root
#     (Dockerfile.backend `USER node` = uid 1000; nginx-unprivileged = uid 101)
#     and both listen ABOVE 1024 (3001, 8080/8443), so neither needs
#     NET_BIND_SERVICE or anything else. certbot is deliberately left alone: it
#     runs as uid 0 and is the only thing that WRITES the TLS material, so an
#     EPERM from a dropped capability would surface as a silently failed
#     `certbot renew` ~60 days later — not something a repo edit can verify.
#
#   read_only: true — NOT set on any service, on purpose:
#     * backend  — SQLite writes explorer.db/-wal/-shm into the /app/data bind
#       mount (that part is fine) but ALSO spills temp b-trees for large sorts,
#       and node writes to /tmp. read_only needs a matching `tmpfs: [/tmp]` and
#       a verified `PRAGMA temp_store`, which is a tested change, not a config
#       tweak.
#     * frontend — the unprivileged nginx image writes its pid file and the
#       proxy/fastcgi/client-body temp dirs under /tmp at startup.
#     * certbot  — writes /etc/letsencrypt and /var/www/certbot by definition.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      # Build provenance — deploy.sh exports these. Defaults keep a bare
      # `docker compose build` working outside the deploy script.
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    container_name: pdexplorer-backend
    restart: unless-stopped
    # See the F-108 block at the top of this file for why these three and not
    # read_only. Runs as uid 1000 and binds 3001, so it needs no capabilities.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    ports:
      # Bind to loopback only. The frontend nginx container reaches the
      # backend over the Docker bridge network using DNS 'backend:3001',
      # not via the host port. Publishing 3001 to 0.0.0.0 would expose
      # the API directly and let clients bypass nginx (Cloudflare, cache
      # headers, /api allowlist, etc.). 127.0.0.1 keeps the port reachable
      # for `curl http://localhost:3001/...` diagnostics from the host
      # without exposing it to the network.
      - "127.0.0.1:3001:3001"
    # Pass every variable from the project's .env through to the container.
    # server.js reads all its knobs (POLKADEX_WS, CMC_API_KEY, BLOCKS_FORWARD_MAX,
    # ALLOWED_ORIGINS, NETWORK_INFO_REFRESH_MS, etc.) via process.env.
    # See .env.example for the full list and defaults.
    env_file:
      - .env
    volumes:
      # Host bind mount for the SQLite index (server.js DATA_DIR = /app/data).
      # A bind mount lives on the host filesystem, so the indexed data survives
      # container deletion, `docker compose down` (even with -v) and
      # `docker volume prune`. Override the host location with DATA_PATH in .env
      # (e.g. an absolute path outside the repo).
      - ${DATA_PATH:-./data}:/app/data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    container_name: pdexplorer-frontend
    restart: unless-stopped
    # nginx-unprivileged runs as uid 101 and listens on 8080/8443, so no
    # NET_BIND_SERVICE (or anything else) is required. Not read_only: the
    # unprivileged image writes its pid + temp dirs under /tmp.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    ports:
      # Container listens on 8080/8443 because nginx runs as the unprivileged
      # uid 101 (audit F-040) and non-root can't bind <1024. The HOST still
      # serves plain 80/443 — externally nothing changes.
      - "80:8080"
      - "443:8443"
    volumes:
      # RELATIVE paths here resolve against the directory Compose runs in, so
      # deploying from a different checkout silently hands nginx an EMPTY cert
      # dir — it then fails to load fullchain.pem, exits, and Cloudflare
      # returns 521 (nothing listening). Set CERTBOT_PATH to an absolute path
      # in .env so the certs are pinned to one location, exactly like DATA_PATH
      # pins the SQLite index.
      #
      # :ro (audit F-040): nginx only READS certs. If the frontend container
      # is compromised it must not be able to overwrite TLS material; only
      # the certbot service holds a writable mount.
      - ${CERTBOT_PATH:-./certbot}/conf:/etc/letsencrypt:ro
      - ${CERTBOT_PATH:-./certbot}/www:/var/www/certbot:ro
    depends_on:
      - backend

  certbot:
    # Audit F-032: pinned — implicit :latest let `docker compose pull` swap
    # the binary that holds the TLS private-key volume with no git diff.
    # When bumping, add the digest for full supply-chain pinning:
    #   docker pull certbot/certbot:<ver> && docker inspect --format='{{index .RepoDigests 0}}' certbot/certbot:<ver>
    # then write image: certbot/certbot:<ver>@sha256:…
    image: certbot/certbot:v2.11.0
    container_name: certbot
    # NO cap_drop here — see the F-108 block at the top of this file. certbot is
    # the one service that runs as uid 0 and rewrites the TLS private key; a
    # capability it turns out to need would fail a renewal ~60 days from now,
    # which no repo-level check catches. no-new-privileges and pids_limit are
    # both inert for what this container does, so they go in.
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    volumes:
      # RELATIVE paths here resolve against the directory Compose runs in, so
      # deploying from a different checkout silently hands nginx an EMPTY cert
      # dir — it then fails to load fullchain.pem, exits, and Cloudflare
      # returns 521 (nothing listening). Set CERTBOT_PATH to an absolute path
      # in .env so the certs are pinned to one location, exactly like DATA_PATH
      # pins the SQLite index.
      - ${CERTBOT_PATH:-./certbot}/conf:/etc/letsencrypt
      - ${CERTBOT_PATH:-./certbot}/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
